[package]
name = "ned-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ned"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ned-core = { version = "0.8.2", path = "../ned-core" }
ned-daemon = { version = "0.8.2", path = "../ned-daemon" }
ned-mcp = { version = "0.8.2", path = "../ned-mcp" }
rustyline = { version = "18", default-features = false, features = ["with-file-history"] }

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.48.0"
serde_json = "1.0.151"
tempfile = "3.27.0"
