[package]
name = "ned-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
lsp-types = "0.97.0"
ned-core = { version = "0.7.0", path = "../ned-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt", "net", "io-util", "time", "macros", "signal", "process", "sync"] }
url = "2.5.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
tempfile = "3.27.0"
url = "2.5.8"
