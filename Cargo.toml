[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.8.2-dev"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/bbessemer/neoed"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Errors carry their fix (`hint::Error`) and only travel the failure path.
result_large_err = "allow"
