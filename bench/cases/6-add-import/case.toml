task = "Add an import"
fixture = "parser"

[ned]
command = '''
ned src/parser.rs -e 'insert after import:std::fmt "use std::io;"'
'''

[sed]
command = '''
sed -i '' '/^use std::fmt;$/a\
use std::io;
' src/parser.rs
'''

[python]
command = '''
python3 - <<'EOF'
from pathlib import Path
p = Path("src/parser.rs")
s = p.read_text()
old = 'use std::fmt;\n'
assert s.count(old) == 1
p.write_text(s.replace(old, old + 'use std::io;\n'))
EOF
'''

[str_replace]
call = '''
{"path": "src/parser.rs", "old_str": "use std::fmt;", "new_str": "use std::fmt;\nuse std::io;"}
'''
