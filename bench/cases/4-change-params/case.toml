task = "Change a function's params"
fixture = "parser"

[ned]
command = '''
ned src/parser.rs -e 'replace fn:new.params with "src: impl Into<String>"'
'''

[sed]
command = '''
sed -i '' 's/fn new(src: &str)/fn new(src: impl Into<String>)/' src/parser.rs
'''

[python]
command = '''
python3 - <<'EOF'
from pathlib import Path
p = Path("src/parser.rs")
s = p.read_text()
old = 'fn new(src: &str)'
assert s.count(old) == 1
p.write_text(s.replace(old, 'fn new(src: impl Into<String>)'))
EOF
'''

[str_replace]
call = '''
{"path": "src/parser.rs", "old_str": "fn new(src: &str)", "new_str": "fn new(src: impl Into<String>)"}
'''
